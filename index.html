<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <!-- บังคับขนาดให้พอดีเป๊ะ ห้ามซูม และเคลียร์พื้นที่ขอบจอ (Dynamic Island) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- รองรับการกด Add to Home Screen บน iPhone ให้ทำตัวเหมือนแอปจริงๆ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EMS Pro | ไปรษณีย์ไทย</title>
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            /* ใช้ 100dvh (Dynamic Viewport Height) แก้ปัญหาแถบ Safari บังขอบล่าง */
            height: 100dvh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: #0f172a; /* สีพื้นหลังให้เนียนไปกับขอบจอแอป */
        }
        iframe { 
            border: none; 
            width: 100%; 
            height: 100%; 
            display: block;
        }
    </style>
</head>
<body>
    <!-- เติมเครื่องหมาย * หลัง camera และ geolocation เพื่อส่งสิทธิ์ทะลุเข้า Apps Script -->
    <iframe 
        id="mainApp"
        src="https://script.google.com/macros/s/AKfycbyuEpb2SWcZ9QGF6FErjzPI08YzC6s6nd_pRzGFz8d1px7dHqYACJL5qgwH10sDQUIq3A/exec"
        allow="camera *; geolocation *; microphone *; clipboard-read; clipboard-write; fullscreen"
        sandbox="allow-top-navigation allow-scripts allow-popups allow-forms allow-same-origin allow-downloads allow-modals"
    ></iframe>

    <script>
        const iframe = document.getElementById('mainApp');
        iframe.onload = function() {
            console.log("EMS Pro App Loaded Successfully");
            iframe.contentWindow.focus();
        };

        // Fallback กันหน้าขาว
        setTimeout(() => {
            if (!iframe.src) iframe.src = iframe.src;
        }, 3000);
    </script>
</body>
</html>
